<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BGSkillz Eval Viewer</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --text: #e4e4e7;
    --text-muted: #a1a1aa;
    --accent: #e94560;
    --success: #22c55e;
    --warning: #eab308;
    --fail: #ef4444;
    --border: #27272a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header h1 {
    font-size: 1.25rem;
    font-weight: 600;
  }

  .header .meta {
    color: var(--text-muted);
    font-size: 0.875rem;
  }

  .tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
  }

  .tab {
    padding: 0.75rem 1.5rem;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    color: var(--text-muted);
    font-size: 0.875rem;
    font-weight: 500;
    transition: all 0.2s;
  }

  .tab:hover { color: var(--text); }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

  .content { padding: 2rem; max-width: 1400px; margin: 0 auto; }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .test-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 1.5rem;
    overflow: hidden;
  }

  .test-card-header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .test-card-header:hover { background: rgba(255,255,255,0.02); }

  .test-id {
    font-weight: 600;
    font-family: monospace;
    font-size: 0.875rem;
    color: var(--accent);
  }

  .badge {
    padding: 0.125rem 0.5rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 600;
  }

  .badge-pass { background: rgba(34,197,94,0.15); color: var(--success); }
  .badge-partial { background: rgba(234,179,8,0.15); color: var(--warning); }
  .badge-fail { background: rgba(239,68,68,0.15); color: var(--fail); }

  .test-card-body { padding: 1.5rem; display: none; }
  .test-card.expanded .test-card-body { display: block; }

  .prompt-block {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1rem;
    margin-bottom: 1rem;
    font-family: monospace;
    font-size: 0.875rem;
    white-space: pre-wrap;
  }

  .comparison-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-top: 1rem;
  }

  .output-panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }

  .output-panel-header {
    padding: 0.5rem 1rem;
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
  }

  .output-panel-header.with-skill { background: rgba(233,69,96,0.1); color: var(--accent); }
  .output-panel-header.without-skill { background: rgba(161,161,170,0.1); color: var(--text-muted); }

  .output-content {
    padding: 1rem;
    font-family: monospace;
    font-size: 0.8125rem;
    white-space: pre-wrap;
    max-height: 500px;
    overflow-y: auto;
    line-height: 1.5;
  }

  .grades-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 1rem;
    font-size: 0.875rem;
  }

  .grades-table th, .grades-table td {
    padding: 0.5rem 0.75rem;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .grades-table th {
    font-weight: 600;
    color: var(--text-muted);
    font-size: 0.75rem;
    text-transform: uppercase;
  }

  .timing { color: var(--text-muted); font-size: 0.75rem; }

  .benchmark-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1rem;
    margin-top: 1rem;
  }

  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
  }

  .metric-label {
    font-size: 0.75rem;
    text-transform: uppercase;
    color: var(--text-muted);
    letter-spacing: 0.05em;
  }

  .metric-value {
    font-size: 2rem;
    font-weight: 700;
    margin: 0.25rem 0;
  }

  .metric-delta { font-size: 0.875rem; }
  .metric-delta.positive { color: var(--success); }
  .metric-delta.negative { color: var(--fail); }

  .feedback-form {
    margin-top: 1.5rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.25rem;
  }

  .feedback-form label {
    font-size: 0.875rem;
    font-weight: 600;
    display: block;
    margin-bottom: 0.5rem;
  }

  .feedback-form textarea {
    width: 100%;
    min-height: 80px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.75rem;
    color: var(--text);
    font-family: inherit;
    font-size: 0.875rem;
    resize: vertical;
  }

  .feedback-form button {
    margin-top: 0.5rem;
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.875rem;
    font-weight: 500;
  }

  .feedback-form button:hover { opacity: 0.9; }

  .load-section {
    text-align: center;
    padding: 4rem 2rem;
  }

  .load-section p { color: var(--text-muted); margin-bottom: 1rem; }

  .load-btn {
    background: var(--accent);
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 500;
  }

  .load-btn:hover { opacity: 0.9; }

  .empty-state {
    text-align: center;
    padding: 3rem;
    color: var(--text-muted);
  }

  @media (max-width: 768px) {
    .comparison-grid { grid-template-columns: 1fr; }
    .content { padding: 1rem; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>BGSkillz Eval Viewer</h1>
  <span class="meta" id="headerMeta">No data loaded</span>
</div>

<div class="tabs">
  <div class="tab active" data-tab="outputs">Outputs</div>
  <div class="tab" data-tab="benchmark">Benchmark</div>
  <div class="tab" data-tab="feedback">Feedback</div>
</div>

<div class="content">
  <div id="tab-outputs" class="tab-panel active">
    <div class="load-section" id="loadSection">
      <p>Load an evals.json file from your evaluation workspace to review results.</p>
      <input type="file" id="fileInput" accept=".json" style="display:none">
      <button class="load-btn" onclick="document.getElementById('fileInput').click()">Load evals.json</button>
      <p style="margin-top:1rem; font-size:0.75rem">Or drag and drop the file anywhere on this page.</p>
    </div>
    <div id="outputsList"></div>
  </div>

  <div id="tab-benchmark" class="tab-panel">
    <div class="empty-state" id="benchmarkEmpty">Load evaluation data to see benchmarks.</div>
    <div id="benchmarkContent" style="display:none"></div>
  </div>

  <div id="tab-feedback" class="tab-panel">
    <div class="empty-state" id="feedbackEmpty">Load evaluation data to provide feedback.</div>
    <div id="feedbackContent" style="display:none"></div>
  </div>
</div>

<script>
  // Tab switching
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
    });
  });

  let evalData = null;
  let feedbackData = {};

  // File loading
  document.getElementById('fileInput').addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) loadFile(file);
  });

  // Drag and drop
  document.addEventListener('dragover', e => e.preventDefault());
  document.addEventListener('drop', e => {
    e.preventDefault();
    const file = e.dataTransfer.files[0];
    if (file) loadFile(file);
  });

  function loadFile(file) {
    const reader = new FileReader();
    reader.onload = e => {
      try {
        evalData = JSON.parse(e.target.result);
        renderAll();
      } catch (err) {
        alert('Error parsing JSON: ' + err.message);
      }
    };
    reader.readAsText(file);
  }

  function renderAll() {
    if (!evalData) return;

    // Update header
    const skillName = evalData.skill_path ? evalData.skill_path.split('/').pop() : 'Unknown';
    document.getElementById('headerMeta').textContent =
      `${skillName} | Iteration ${evalData.iteration || '?'} | ${evalData.test_count || 0} tests | ${evalData.timestamp || ''}`;

    // Hide load section
    document.getElementById('loadSection').style.display = 'none';

    // Render outputs
    renderOutputs();
    renderBenchmark();
    renderFeedback();
  }

  function renderOutputs() {
    const container = document.getElementById('outputsList');
    container.innerHTML = '';

    if (!evalData.results || evalData.results.length === 0) {
      container.innerHTML = '<div class="empty-state">No test results found.</div>';
      return;
    }

    evalData.results.forEach((result, i) => {
      const card = document.createElement('div');
      card.className = 'test-card';
      card.innerHTML = `
        <div class="test-card-header" onclick="this.parentElement.classList.toggle('expanded')">
          <div>
            <span class="test-id">${result.id}</span>
            <span class="timing">${result.with_skill?.elapsed_seconds || '?'}s with / ${result.without_skill?.elapsed_seconds || '?'}s without</span>
          </div>
          <span class="badge ${result.with_skill?.success ? 'badge-pass' : 'badge-fail'}">
            ${result.with_skill?.success ? 'OK' : 'ERROR'}
          </span>
        </div>
        <div class="test-card-body">
          <div class="prompt-block">${escapeHtml(result.prompt)}</div>
          ${result.assertions && result.assertions.length > 0 ? `
            <table class="grades-table">
              <thead><tr><th>Assertion</th></tr></thead>
              <tbody>${result.assertions.map(a => `<tr><td>${escapeHtml(a)}</td></tr>`).join('')}</tbody>
            </table>
          ` : ''}
          <div class="comparison-grid">
            <div class="output-panel">
              <div class="output-panel-header with-skill">With Skill</div>
              <div class="output-content" id="with-${i}">Loading...</div>
            </div>
            <div class="output-panel">
              <div class="output-panel-header without-skill">Without Skill (Baseline)</div>
              <div class="output-content" id="without-${i}">Loading...</div>
            </div>
          </div>
        </div>
      `;
      container.appendChild(card);

      // Try to load output files if paths are available
      loadOutput(result.with_skill?.output_path, `with-${i}`);
      loadOutput(result.without_skill?.output_path, `without-${i}`);
    });
  }

  function loadOutput(path, elementId) {
    const el = document.getElementById(elementId);
    if (!el) return;

    if (!path) {
      el.textContent = '[No output path]';
      return;
    }

    // For local file viewing, outputs need to be loaded separately
    // In a served context, fetch the file
    el.textContent = `[Output file: ${path}]\n\nTo view outputs inline, serve this viewer with a local server\nor paste output content here manually.`;
  }

  function renderBenchmark() {
    if (!evalData.results || evalData.results.length === 0) return;

    document.getElementById('benchmarkEmpty').style.display = 'none';
    const container = document.getElementById('benchmarkContent');
    container.style.display = 'block';

    const withTimes = evalData.results.map(r => r.with_skill?.elapsed_seconds || 0);
    const withoutTimes = evalData.results.map(r => r.without_skill?.elapsed_seconds || 0);
    const meanWith = withTimes.reduce((a, b) => a + b, 0) / withTimes.length;
    const meanWithout = withoutTimes.reduce((a, b) => a + b, 0) / withoutTimes.length;
    const timeDelta = meanWith - meanWithout;
    const successRate = evalData.results.filter(r => r.with_skill?.success).length / evalData.results.length;

    container.innerHTML = `
      <div class="benchmark-grid">
        <div class="metric-card">
          <div class="metric-label">Test Cases</div>
          <div class="metric-value">${evalData.test_count || evalData.results.length}</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Success Rate (With Skill)</div>
          <div class="metric-value">${(successRate * 100).toFixed(0)}%</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Avg Time (With Skill)</div>
          <div class="metric-value">${meanWith.toFixed(1)}s</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Avg Time (Baseline)</div>
          <div class="metric-value">${meanWithout.toFixed(1)}s</div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Time Delta</div>
          <div class="metric-value">
            <span class="metric-delta ${timeDelta > 0 ? 'negative' : 'positive'}">
              ${timeDelta > 0 ? '+' : ''}${timeDelta.toFixed(1)}s
            </span>
          </div>
        </div>
        <div class="metric-card">
          <div class="metric-label">Iteration</div>
          <div class="metric-value">${evalData.iteration || '?'}</div>
        </div>
      </div>
    `;
  }

  function renderFeedback() {
    if (!evalData.results || evalData.results.length === 0) return;

    document.getElementById('feedbackEmpty').style.display = 'none';
    const container = document.getElementById('feedbackContent');
    container.style.display = 'block';

    container.innerHTML = evalData.results.map((result, i) => `
      <div class="feedback-form">
        <label>${result.id}: ${result.prompt.substring(0, 80)}${result.prompt.length > 80 ? '...' : ''}</label>
        <textarea id="feedback-${i}" placeholder="What should improve? What worked well?">${feedbackData[result.id] || ''}</textarea>
        <button onclick="saveFeedback('${result.id}', ${i})">Save Feedback</button>
      </div>
    `).join('');

    container.innerHTML += `
      <div style="margin-top:1.5rem; text-align:center">
        <button class="load-btn" onclick="exportFeedback()">Export All Feedback as JSON</button>
      </div>
    `;
  }

  function saveFeedback(testId, index) {
    const textarea = document.getElementById('feedback-' + index);
    feedbackData[testId] = textarea.value;
  }

  function exportFeedback() {
    // Save all current feedback
    evalData.results.forEach((result, i) => {
      const textarea = document.getElementById('feedback-' + i);
      if (textarea && textarea.value) {
        feedbackData[result.id] = textarea.value;
      }
    });

    const output = {
      skill_path: evalData.skill_path,
      iteration: evalData.iteration,
      timestamp: new Date().toISOString(),
      feedback: Object.entries(feedbackData).map(([id, text]) => ({
        test_id: id,
        feedback: text,
      })),
    };

    const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'feedback.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }
</script>

</body>
</html>
